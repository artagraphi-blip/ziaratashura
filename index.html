<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>زیارت عاشورا</title>
<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
<style>
/* فونت: فایل font.woff (تبدیل‌شده‌ی Adobe Arabic Bold) کنار index.html باشد */
@font-face{font-family:"ZFont";src:url("font.woff") format("woff");font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#e9e7f2;--card:#fff;--tx:#1f1b2e;--mut:#7a7690;--bd:#e1ddf0;--acc:#6a3df0;--glow:rgba(106,61,240,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a3a3d;--card:#1f1f22;--tx:#f4f2fb;--mut:#8d8a9b;--bd:#34323f;--acc:#7c4dff;--glow:rgba(124,77,255,.38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#3a3a3d;--card:#1f1f22;--tx:#f4f2fb;--mut:#8d8a9b;--bd:#34323f;--acc:#7c4dff;--glow:rgba(124,77,255,.38);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Vazir,Tahoma,sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:14px}
.card{position:relative;overflow:hidden;background:radial-gradient(110% 38% at 50% 0%,var(--glow),transparent 70%),var(--card);border:1px solid var(--bd);border-radius:36px;padding:22px 18px 18px;box-shadow:0 24px 50px -20px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:38%;height:5px;background:var(--acc);border-radius:0 0 12px 12px}
button{font:inherit;color:var(--tx);cursor:pointer}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h1{margin:0;font-size:20px;text-align:center;line-height:1.5}
.head small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:none;display:grid;place-items:center;flex:none}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 14px;max-height:132px;overflow-y:auto}
.d{aspect-ratio:1;border-radius:50%;border:0;background:none;color:var(--mut);font-size:15px}
.d.on{background:var(--acc);color:#fff;font-weight:700;box-shadow:0 6px 16px var(--glow)}
.tools{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tl{border:1px solid var(--bd);background:none;border-radius:99px;padding:2px 14px;font-size:14px}
.tl.on{border-color:var(--acc);color:var(--acc)}
.txt{font-family:"ZFont","Traditional Arabic","Scheherazade New",Tahoma,serif;font-size:var(--fs,26px);line-height:2.3;text-align:center;padding:6px 4px 12px;min-height:150px;white-space:pre-wrap}
.tr{font-size:15px;line-height:2;color:var(--mut);text-align:center;border-top:1px dashed var(--bd);padding-top:10px;white-space:pre-wrap}
.note{background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:12px;padding:6px 12px;font-size:13px;margin-bottom:8px;text-align:center}
.au{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:22px;padding:8px 12px;margin-top:12px}
.pl{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px var(--glow);flex:none}
.pl svg{width:20px;height:20px;fill:#fff}
.au .m{flex:1;min-width:0}
.au .m b{font-size:14px;display:block}
input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0}
.tm{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;direction:ltr}
</style>
</head>
<body>
<div class="w"><div class="card">
  <div class="head">
    <button class="rb" id="prev" aria-label="قبلی"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    <h1>زیارت عاشورا<small id="pos"></small></h1>
    <button class="rb" id="next" aria-label="بعدی"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <button class="tl" id="fm">A−</button><button class="tl" id="fp">A+</button>
    <button class="tl" id="trb" style="display:none">ترجمه</button>
    <button class="tl" id="th">☾ / ☀</button>
  </div>
  <div id="warn" class="note" style="display:none"></div>
  <div class="txt" id="txt"></div>
  <div class="tr" id="tr" style="display:none"></div>
  <div class="au">
    <button class="pl" id="pl" aria-label="پخش"><svg viewBox="0 0 24 24" id="ic"><path d="M7 4l13 8-13 8z"/></svg></button>
    <div class="m"><b id="au-t">پخش روضه همراه با زیارت</b>
      <input type="range" id="sk" min="0" max="100" value="0">
      <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  </div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const SAMPLE=["اَلسَّلامُ عَلَیْکَ یا اَبا عَبْدِاللهِ\nاَلسَّلامُ عَلَیْکَ یَا بْنَ رَسُولِ اللهِ"];
const AUDIO_FILE="rowzeh.mp3";
let parts=[],tr=[],i=0,showTr=false;
const root=document.documentElement;
const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
try{const W=window.Eitaa&&window.Eitaa.WebApp;if(W){W.ready&&W.ready();W.expand&&W.expand()}}catch(e){}
const fa=n=>n.toLocaleString("fa-IR");

/* تم و اندازه */
const sv=st("th");if(sv)root.setAttribute("data-theme",sv);
$("th").onclick=()=>{const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);const n=dark?"light":"dark";root.setAttribute("data-theme",n);st("th",n)};
let fs=+st("fs")||26;const setFs=()=>{root.style.setProperty("--fs",fs+"px");st("fs",fs)};setFs();
$("fp").onclick=()=>{fs=Math.min(44,fs+2);setFs()};$("fm").onclick=()=>{fs=Math.max(18,fs-2);setFs()};

/* بارگذاری متن: فایل ziyarat.txt (بخش‌ها با خط --- جدا می‌شوند) */
async function load(u){try{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)return null;const t=await r.text();const a=t.split(/^\s*---\s*$/m).map(s=>s.trim()).filter(Boolean);return a.length?a:null}catch(e){return null}}
async function init(){
  const a=await load("ziyarat.txt");
  if(a)parts=a;else{parts=SAMPLE;$("warn").style.display="block";$("warn").textContent="متن نمونه: فایل ziyarat.txt را اضافه کنید تا متن کامل نمایش داده شود."}
  const t=await load("tarjome.txt");if(t){tr=t;$("trb").style.display="inline-block"}
  const g=$("grid");parts.forEach((_,k)=>{const b=document.createElement("button");b.className="d";b.textContent=fa(k+1);b.onclick=()=>go(k);g.appendChild(b)});
  go(0);
}
function go(k){
  i=Math.max(0,Math.min(parts.length-1,k));
  $("txt").textContent=parts[i];
  const t=$("tr");t.style.display=showTr&&tr[i]?"block":"none";t.textContent=tr[i]||"";
  $("pos").textContent="بخش "+fa(i+1)+" از "+fa(parts.length);
  document.querySelectorAll(".d").forEach((d,n)=>d.classList.toggle("on",n===i));
  $("prev").disabled=i===0;$("next").disabled=i===parts.length-1;
  const on=document.querySelector(".d.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest"});
}
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);
$("trb").onclick=()=>{showTr=!showTr;$("trb").classList.toggle("on",showTr);go(i)};

/* پخش روضه (کاربر باید دکمه را بزند؛ مرورگر پخش خودکار را مسدود می‌کند) */
const au=new Audio(AUDIO_FILE);au.loop=true;au.preload="metadata";
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const PLAY='<path d="M7 4l13 8-13 8z"/>',PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
$("pl").onclick=()=>{
  if(au.paused){au.play().catch(()=>{$("au-t").textContent="فایل صوتی هنوز اضافه نشده یا پخش نشد"})}else au.pause();
};
au.onplay=()=>$("ic").innerHTML=PAUSE;au.onpause=()=>$("ic").innerHTML=PLAY;
au.onloadedmetadata=()=>{$("dur").textContent=fmt(au.duration);$("sk").max=Math.floor(au.duration)||100};
au.ontimeupdate=()=>{$("cur").textContent=fmt(au.currentTime);$("sk").value=Math.floor(au.currentTime)};
au.onerror=()=>{$("au-t").textContent="فایل صوتی هنوز اضافه نشده"};
$("sk").oninput=e=>{au.currentTime=+e.target.value};
init();
</script>
</body>
</html>
